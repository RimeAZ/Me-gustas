<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ya no te enojes, preciosa 💗</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%97%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(160deg, #ffdde1 0%, #ffb6c8 40%, #ff8fab 75%, #ff6f91 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
      color: #7a1f3d;
      text-align: center;
    }

    /* resplandor suave detrás */
    .glow {
      position: fixed;
      top: 50%; left: 50%;
      width: 120vw; height: 120vw;
      max-width: 900px; max-height: 900px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(255,255,255,0.55) 0%, rgba(255,182,193,0) 60%);
      pointer-events: none;
      animation: breathe 5s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
    }

    /* corazones flotando de fondo */
    .floaters { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
    .floaters span {
      position: absolute;
      bottom: -40px;
      color: rgba(255,255,255,0.75);
      animation: floatUp linear infinite;
      will-change: transform, opacity;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.9; }
      90%  { opacity: 0.8; }
      100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
    }

    .card {
      position: relative;
      z-index: 2;
      padding: 46px 34px 40px;
      max-width: 480px;
      width: 88%;
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(14px) saturate(130%);
      -webkit-backdrop-filter: blur(14px) saturate(130%);
      border: 1.5px solid rgba(255, 255, 255, 0.6);
      border-radius: 30px;
      box-shadow: 0 22px 60px rgba(180, 60, 90, 0.28);
      animation: pop 1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes pop {
      from { opacity: 0; transform: translateY(30px) scale(0.94); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .pre {
      font-size: 1.05rem;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #b83a5e;
      margin-bottom: 6px;
      opacity: 0.85;
    }

    .msg {
      font-family: 'Dancing Script', cursive;
      font-weight: 700;
      font-size: clamp(2.1rem, 8vw, 3.2rem);
      line-height: 1.15;
      color: #8a1f42;
      text-shadow: 0 2px 8px rgba(255,255,255,0.5);
    }

    /* corazón latiendo */
    .heart {
      font-size: clamp(3.4rem, 16vw, 5rem);
      margin: 18px 0 8px;
      display: inline-block;
      filter: drop-shadow(0 6px 14px rgba(200, 40, 70, 0.45));
      animation: beat 1.1s ease-in-out infinite;
      cursor: pointer;
      user-select: none;
    }
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.22); }
      30% { transform: scale(1); }
      45% { transform: scale(1.16); }
    }

    .sub {
      margin-top: 6px;
      font-size: 1.05rem;
      font-weight: 500;
      color: #7a2a48;
      line-height: 1.6;
    }

    .btn {
      margin-top: 26px;
      border: none;
      padding: 14px 30px;
      border-radius: 999px;
      font-family: 'Quicksand', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #ff6f91, #ff4d6d);
      box-shadow: 0 10px 24px rgba(255, 77, 109, 0.45);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(255, 77, 109, 0.55); }
    .btn:active { transform: scale(0.96); }

    .signoff {
      margin-top: 22px;
      font-family: 'Dancing Script', cursive;
      font-size: 1.5rem;
      color: #b83a5e;
      opacity: 0.9;
    }

    @media (max-width: 400px) {
      .card { padding: 38px 22px 32px; }
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="floaters" id="floaters" aria-hidden="true"></div>

  <main class="card">
    <p class="pre">Perdóname porfa</p>
    <h1 class="msg">Ya no te enojes,<br>preciosa</h1>
    <div class="heart" id="heart" title="Tócame 💗">❤️</div>
    <p class="sub">Que tu sonrisa vale más que cualquier enojo.<br>Aquí sigo, cuidándote un montón. 🤍</p>
    <button class="btn" id="btn">Te mando un abrazo 🫂</button>
    <p class="signoff">con cariño, para ti</p>
  </main>

  <script>
    // corazones flotando de fondo (con cuentagotas)
    const emojis = ['💗', '💖', '💕', '❤️', '🩷', '🌸'];
    const floaters = document.getElementById('floaters');
    function spawnHeart() {
      const s = document.createElement('span');
      s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      s.style.left = Math.random() * 100 + 'vw';
      s.style.fontSize = 16 + Math.random() * 26 + 'px';
      s.style.animationDuration = 7 + Math.random() * 7 + 's';
      floaters.appendChild(s);
      setTimeout(() => s.remove(), 15000);
    }
    for (let i = 0; i < 12; i++) setTimeout(spawnHeart, i * 400);
    setInterval(spawnHeart, 900);

    // explosión de corazones al tocar el corazón o el botón
    function burst(x, y) {
      for (let i = 0; i < 16; i++) {
        const s = document.createElement('span');
        s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        s.style.position = 'fixed';
        s.style.left = x + 'px';
        s.style.top = y + 'px';
        s.style.fontSize = 14 + Math.random() * 22 + 'px';
        s.style.pointerEvents = 'none';
        s.style.zIndex = 5;
        s.style.transition = 'transform 1s ease-out, opacity 1s ease-out';
        document.body.appendChild(s);
        const angle = Math.random() * Math.PI * 2;
        const dist = 60 + Math.random() * 120;
        requestAnimationFrame(() => {
          s.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px) scale(0.4)`;
          s.style.opacity = '0';
        });
        setTimeout(() => s.remove(), 1000);
      }
    }

    const heart = document.getElementById('heart');
    heart.addEventListener('click', (e) => burst(e.clientX, e.clientY));

    const btn = document.getElementById('btn');
    btn.addEventListener('click', () => {
      const r = btn.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2);
      btn.textContent = 'Ya no te enojes, ¿sí? 🥺💗';
    });
  </script>
</body>
</html>
